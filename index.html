<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion-Based Music Player</title>
  <meta name="description" content="A fast, modern music player that detects your mood from facial expressions and plays matching music." />

  <!-- Open Graph -->
  <meta property="og:title" content="Emotion-Based Music Player" />
  <meta property="og:description" content="A music player that detects your mood from facial expressions and plays matching music." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/images/preview.jpg" />

  <!-- Preconnect for the (lazily loaded) face-api CDN -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

  <!-- Icons (deferred, non-blocking) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    media="print"
    onload="this.media='all'"
  />

  <!-- Styles -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <main class="player" aria-label="Emotion-based music player">
    <h1 class="title">Emotion-Based Music Player</h1>

    <!-- Toast / error notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <!-- Search + webcam -->
    <section class="search-section" aria-label="Search">
      <div class="search-container">
        <label for="search-input" class="visually-hidden">Search songs or moods</label>
        <input
          type="text"
          id="search-input"
          placeholder="Search songs or moods (happy, calm, relaxed)…"
          autocomplete="off"
        />
        <button id="search-btn" type="button" aria-label="Search">
          <i class="fa fa-search" aria-hidden="true"></i>
        </button>
      </div>
      <button id="webcam-btn" type="button" title="Search by facial expression" aria-label="Search by facial expression">
        <i class="fa fa-camera" aria-hidden="true"></i>
      </button>
    </section>

    <!-- Now playing -->
    <section class="details" aria-label="Now playing">
      <p class="now-playing">PLAYING x OF y</p>
      <div class="track-art" role="img" aria-label="Album art"></div>
      <p class="track-name">Track Name</p>
      <p class="track-artist">Track Artist</p>
    </section>

    <!-- Transport controls -->
    <section class="buttons" aria-label="Playback controls">
      <button class="prev-track" type="button" aria-label="Previous track">
        <i class="fa fa-step-backward fa-2x" aria-hidden="true"></i>
      </button>
      <button class="playpause-track" type="button" aria-label="Play or pause">
        <i class="fa fa-play-circle fa-5x" aria-hidden="true"></i>
      </button>
      <button class="next-track" type="button" aria-label="Next track">
        <i class="fa fa-step-forward fa-2x" aria-hidden="true"></i>
      </button>
    </section>

    <!-- Seek -->
    <div class="slider_container">
      <span class="current-time">00:00</span>
      <label for="seek_slider" class="visually-hidden">Seek</label>
      <input type="range" id="seek_slider" min="0" max="100" value="0" step="0.1" class="seek_slider" />
      <span class="total-duration">00:00</span>
    </div>

    <!-- Volume -->
    <div class="slider_container">
      <i class="fa fa-volume-down" aria-hidden="true"></i>
      <label for="volume_slider" class="visually-hidden">Volume</label>
      <input type="range" id="volume_slider" min="0" max="100" value="80" class="volume_slider" />
      <i class="fa fa-volume-up" aria-hidden="true"></i>
    </div>

    <div class="reshuffle-container">
      <button id="reshuffle-btn" type="button">
        <i class="fa fa-random" aria-hidden="true"></i> Reshuffle
      </button>
    </div>

    <footer>
      <p>
        Emotion-Based Music Player •
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer">View on GitHub</a>
      </p>
    </footer>
  </main>

  <!-- Webcam modal (face-api.js is loaded lazily when opened) -->
  <div id="webcam-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="webcam-modal-title" hidden>
    <div class="modal-content">
      <button class="close-btn" type="button" aria-label="Close">&times;</button>
      <h2 id="webcam-modal-title">Facial Expression Search</h2>
      <div id="webcam-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
      </div>
      <div class="webcam-controls">
        <button id="capture-btn" type="button">Capture Expression</button>
        <button id="search-expression-btn" type="button" disabled>Search</button>
      </div>
      <div id="expression-result" aria-live="polite"></div>
    </div>
  </div>

  <!-- Single ES module entry point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
